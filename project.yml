name: HealthNote
options:
  bundleIdPrefix: com.lldkinn9
  deploymentTarget:
    iOS: "17.6"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "" # XcodeのSigning & Capabilitiesで自身のTeamを選択してください
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  HealthNote:
    type: application
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: HealthNote/App
      - path: HealthNote/DesignSystem
      - path: HealthNote/Models
      - path: HealthNote/Services
      - path: HealthNote/Views
      - path: HealthNote/Resources/Assets.xcassets
      - path: HealthNote/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: HealthNote/Resources/Info.plist
    entitlements:
      path: HealthNote/Resources/HealthNote.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lldkinn9.Health-Note
        INFOPLIST_FILE: HealthNote/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthNote/Resources/HealthNote.entitlements
        TARGETED_DEVICE_FAMILY: "1" # iPhone専用 (1)
    dependencies:
      - target: HealthNoteWidgetExtension
        embed: true

  HealthNoteWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: HealthNote/Widgets/HealthNoteWidget.swift
      - path: HealthNote/DesignSystem/Theme.swift
      - path: HealthNote/Services/WidgetDataManager.swift
      - path: HealthNote/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: HealthNote/Widgets/Widget-Info.plist
    entitlements:
      path: HealthNote/Widgets/HealthNoteWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lldkinn9.Health-Note.widget
        INFOPLIST_FILE: HealthNote/Widgets/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthNote/Widgets/HealthNoteWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

